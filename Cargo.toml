[package]
name = "unsharek-tcb"
version = "0.0.0"
description = "Lockdown for an in-process sandbox: checks the process's threads, fds and mappings, drops what it may not keep, and installs one seccomp filter"
# Its own repository: nothing here is inherited from a workspace. seccomp-fn is pinned by commit
# (unsharek's workspace patches it to its submodule).
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[dependencies]
# The filter: Rust functions parsed into a tree (seccomp-fn: not trusted, but for the round trip
# it runs) and compiled by seccomp-fn-verify's compiler, proven once for every tree (src/filter.rs)
seccomp-fn = { git = "ssh://git@github.com/ryanrasti1/seccomp-fn.git", branch = "structural-call" }
seccomp-fn-verify = { git = "ssh://git@github.com/ryanrasti1/seccomp-fn-verify.git", branch = "structural-call" }
# Lockdown's syscalls and constants
libc = "0.2"
# Typed wrappers for lockdown's syscalls but close_range and seccomp (raw syscalls, no libc)
rustix = { version = "1", default-features = false, features = ["std", "thread", "process", "fs", "net"] }

[dev-dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[features]
# The tests' and benches' hooks (lockdown's timings, `map_ok`): never part of the API.
testing = []
